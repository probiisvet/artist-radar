# Render Blueprint — declarative deploy config.
# Usage: in Render dashboard, click "New +" → "Blueprint" → connect this repo.
# Render will read this file and create the service automatically.

services:
  - type: web
    name: artist-radar
    runtime: node
    plan: free
    region: frankfurt   # change to your closest: oregon, ohio, frankfurt, singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Turso cloud database (free forever):
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      # Google Programmable Search — web-searches each artist for tour/ticket
      # links. Truly free (100 queries/day, no credit card). Two values:
      #   GOOGLE_API_KEY  — console.cloud.google.com (enable "Custom Search API")
      #   GOOGLE_CSE_ID   — programmablesearchengine.google.com (search engine id)
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_CSE_ID
        sync: false
      - key: MAX_FOLLOWERS
        value: '1000000'
      # Last.fm — discovery data source. Add the real key in the dashboard.
      - key: LASTFM_API_KEY
        sync: false
      # "Emerging" window on the Last.fm listener scale (NOT Spotify scale).
      - key: LASTFM_MAX_LISTENERS
        value: '80000'
      - key: REFRESH_CRON
        value: '0 9 * * *'
      # Email — optional, fill in via dashboard:
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_TO
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_SECURE
        value: 'false'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
