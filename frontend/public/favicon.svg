<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Rounded dark background — works in browser tab AND as app icon -->
  <rect width="100" height="100" rx="22" fill="#0e0e12"/>

  <!-- Concentric radar rings -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#1DB954" stroke-width="2.5" opacity="0.25"/>
  <circle cx="50" cy="50" r="28" fill="none" stroke="#1DB954" stroke-width="2.5" opacity="0.45"/>
  <circle cx="50" cy="50" r="16" fill="none" stroke="#1DB954" stroke-width="2.5" opacity="0.65"/>

  <!-- Radar sweep (gradient wedge) -->
  <defs>
    <linearGradient id="sweep" x1="50%" y1="50%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1DB954" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1DB954" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <path d="M 50 50 L 90 50 A 40 40 0 0 0 78 22 Z" fill="url(#sweep)"/>

  <!-- Sweep line -->
  <line x1="50" y1="50" x2="90" y2="50" stroke="#1DB954" stroke-width="4" stroke-linecap="round"/>

  <!-- Detected blip — the "emerging artist" we just found -->
  <circle cx="71" cy="29" r="7" fill="#ff6b9d"/>
  <circle cx="71" cy="29" r="11" fill="none" stroke="#ff6b9d" stroke-width="1.5" opacity="0.4"/>

  <!-- Radar hub -->
  <circle cx="50" cy="50" r="5" fill="#1DB954"/>
  <circle cx="50" cy="50" r="2" fill="#0e0e12"/>
</svg>
